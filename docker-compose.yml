services:
  backend:
    image: ${GAM_BACKEND_IMAGE:-ghcr.io/kaibush/grok-account-monitor-backend:latest}
    build:
      context: ./backend
    init: true
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      GAM_HOST: 0.0.0.0
      GAM_PORT: 8090
      GAM_DATABASE_PATH: /app/data/monitor.db
      GAM_RUNTIME_SECRET_KEY: ${GAM_RUNTIME_SECRET_KEY:-}
      GAM_JWT_SECRET_KEY: ${GAM_JWT_SECRET_KEY:-}
      GAM_JWT_TTL_SECONDS: ${GAM_JWT_TTL_SECONDS:-604800}
      GAM_GROK2API_BASE_URL: ${GAM_GROK2API_BASE_URL:-http://host.docker.internal:8000}
      GAM_GROK2API_ADMIN_USERNAME: ${GAM_GROK2API_ADMIN_USERNAME:-}
      GAM_GROK2API_ADMIN_PASSWORD: ${GAM_GROK2API_ADMIN_PASSWORD:-}
      GAM_GROK_REGISTER_WEBHOOK_TOKEN: ${GAM_GROK_REGISTER_WEBHOOK_TOKEN:-}
      GAM_INITIAL_PROBE_ON_REGISTER: ${GAM_INITIAL_PROBE_ON_REGISTER:-false}
      GAM_REGISTER_PROBE_PROFILE_IDS: '${GAM_REGISTER_PROBE_PROFILE_IDS:-["quality-marker"]}'
      GAM_REGISTER_PROBE_EXECUTION_MODE: ${GAM_REGISTER_PROBE_EXECUTION_MODE:-chat}
      GAM_REGISTER_PROBE_ROUNDS: ${GAM_REGISTER_PROBE_ROUNDS:-3}
      GAM_REGISTER_PROBE_PROXY_TARGETS: '${GAM_REGISTER_PROBE_PROXY_TARGETS:-[{"kind":"direct","id":null}]}'
      GAM_CORS_ORIGINS: ${GAM_CORS_ORIGINS:-https://monitor.lvyrix.com,http://localhost:8091,http://127.0.0.1:8091}
    volumes:
      - monitor-data:/app/data
    ports:
      - 127.0.0.1:${GAM_API_PORT:-8090}:8090
    extra_hosts:
      - host.docker.internal:host-gateway

  frontend:
    image: ${GAM_FRONTEND_IMAGE:-ghcr.io/kaibush/grok-account-monitor-frontend:latest}
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    init: true
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - 127.0.0.1:${GAM_WEB_PORT:-8091}:80

volumes:
  monitor-data:
