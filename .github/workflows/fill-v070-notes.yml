name: Fill v0.7.0 release notes

on:
  workflow_run:
    workflows: ["Docker images"]
    types: [completed]

permissions:
  contents: write

jobs:
  fill:
    if: ${{ github.event.workflow_run.head_branch == 'v0.7.0' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Update GitHub Release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v0.7.0 --repo "$GITHUB_REPOSITORY" --title "v0.7.0" --notes-file .github/release-notes-v0.7.0.md
